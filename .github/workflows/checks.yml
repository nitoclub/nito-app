name: "Checks"

on:
  pull_request:
    branches:
      - main

# Cancel any current or previous job from the same PR
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed:
    runs-on: ubuntu-24.04
    outputs:
      android: ${{ steps.changes.outputs.android }}
      ios: ${{ steps.changes.outputs.ios }}
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      # https://github.com/marketplace/actions/checkout
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # https://github.com/marketplace/actions/paths-changes-filter
      - name: Paths Changes Filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: changes
        with:
          filters: |
            android:
              - 'app/android/**/*'
              - 'app/shared/**/*'
              - 'build-logic/**/*'
              - 'core/**/*'
              - 'feature/**/*'
              - 'gradle/**/*'
              - 'build.gradle.kts'
              - 'gradle.properties'
              - 'settings.gradle.kts'
            ios:
              - 'app/ios/**/*'
              - 'app/ios-combined/**/*'
              - 'app/shared/**/*'
              - 'build-logic/**/*'
              - 'core/**/*'
              - 'feature/**/*'
              - 'gradle/**/*'
              - 'build.gradle.kts'
              - 'gradle.properties'
              - 'settings.gradle.kts'
            backend:
              - 'app/backend/**/*'
              - 'build-logic/**/*'
              - 'core/**/*'
              - 'gradle/**/*'
              - 'build.gradle.kts'
              - 'gradle.properties'
              - 'settings.gradle.kts'

  check-android:
    runs-on: ubuntu-24.04
    needs: changed
    if: needs.changed.outputs.android == 'true'
    steps:
      # https://github.com/marketplace/actions/checkout
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: 'true'

      - name: Copy CI gradle.properties
        shell: bash
        run: |
          mkdir -p ~/.gradle
          cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      # https://github.com/marketplace/actions/setup-java-jdk
      - name: Setup Java JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: 17

      # https://github.com/marketplace/actions/build-with-gradle
      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build
        run: ./gradlew :app:android:assembleDevDebug

  check-ios:
    runs-on: macos-14
    needs: changed
    if: needs.changed.outputs.ios == 'true'
    strategy:
      matrix:
        destination: [ 'platform=iOS Simulator,OS=17.2,name=iPhone 15' ]
    steps:
      # https://github.com/marketplace/actions/checkout
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Copy CI gradle.properties
        shell: bash
        run: |
          mkdir -p ~/.gradle
          cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      # https://github.com/marketplace/actions/setup-java-jdk
      - name: Setup Java JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: 17

      # https://github.com/marketplace/actions/build-with-gradle
      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # https://github.com/marketplace/actions/setup-xcode-version
      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '15.1.0'

      - name: Build iOS framework
        run: ./gradlew :app:ios-combined:assembleNitoKmpReleaseXCFramework

      - name: Run iOS unit tests
        continue-on-error: true
        run: xcodebuild clean build -project app/ios/App/Nito/Nito.xcodeproj -configuration Debug -scheme Dev -sdk iphoneos -destination "${destination}" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO ONLY_ACTIVE_ARCH=NO -test-timeouts-enabled YES
        env:
          destination: ${{ matrix.destination }}

  check-backend:
    runs-on: ubuntu-24.04
    needs: changed
    if: needs.changed.outputs.backend == 'true'
    steps:
      # https://github.com/marketplace/actions/checkout
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: 'true'

      - name: Copy CI gradle.properties
        shell: bash
        run: |
          mkdir -p ~/.gradle
          cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      # https://github.com/marketplace/actions/setup-java-jdk
      - name: Setup Java JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: 17

      # https://github.com/marketplace/actions/build-with-gradle
      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Unit Tests
        run: ./gradlew :app:backend:check

      - name: Build
        run: ./gradlew :app:backend:buildFatJar

  status-check:
    runs-on: ubuntu-24.04
    needs:
      - check-android
      - check-ios
      - check-backend
    permissions: { }
    if: failure()
    steps:
      - run: exit 1
